name: Contact permission regression
on:
  push:
    branches: ["fix/contact-request-forbidden-20261011"]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx --no-install tsx --test test/contact-request-permission-errors.test.ts
      - run: npm test
      - run: npm run build
